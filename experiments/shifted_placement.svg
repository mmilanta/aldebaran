</g>
<text x="57" y="628" font-size="25" fill="#f4f1e8" >Total = 81/16 = 5.0625</text>
<text x="57" y="664" font-size="21" fill="#c7c7d4" >All six bounded pockets are shaded.</text>
</g>
<g data-arrangement="1" data-slopes="1.0,1.6502407664751184,2.1621461314384454,2.603606875834442,3.0" data-origin="643" data-center="620" data-scale="29">
