<text x="637" y="628" font-size="25" fill="#f4f1e8" >Total ≈ 5.097121872</text>
<text x="637" y="664" font-size="21" fill="#c7c7d4" >All six bounded pockets are shaded.</text>
</g>
<text x="35" y="733" font-size="22" fill="#c7c7d4" >The optimized total gains about 0.6839%. Both panels use identical unit scales.</text>
<text x="35" y="770" font-size="22" fill="#c7c7d4" >This maximizes the whole band; it does not maximize the smallest pocket.</text>
