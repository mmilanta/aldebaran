<text x="35" y="1500" font-size="22" fill="#c7c7d4" >An increasing ratio recurrence selects the unique finite optimum for every count.</text>
<text x="35" y="1541" font-size="21" fill="#c7c7d4" >The saved node and area bounds are rational. These coordinates and decimals are rounded.</text>
