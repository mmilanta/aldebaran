<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1630" viewBox="0 0 1200 1630" role="group" aria-labelledby="title description">
<title id="title">Put more curves where the intercept bends</title>
<desc id="description">Five parabolas with cubic intercepts share outer slopes one and three. Equal slope gaps give total bounded area 5.0625. The unique finite optimum uses interior labels about 1.650241, 2.162146, and 2.603607, giving area about 5.097122 and decreasing gaps. Both arrangement panels use identical coordinates and unit scale. Three slope rulers compare equal spacing, the asymptotic density quantiles, and the finite optimum. A table resolves the small differences between the latter two. This is a total-area optimum, not a smallest-pocket theorem, and applies to the cubic intercept family.</desc>
<rect width="1200" height="1630" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="65" font-size="43" fill="#f4f1e8" >Put more curves where the intercept bends.</text>
<text x="35" y="111" font-size="25" fill="#c7c7d4" >Five parabolas. Six pockets. One unique largest total.</text>
<text x="35" y="153" font-size="23" fill="#c7c7d4" >Cubic intercepts: Xₚ = Y²/2 − pY + p³/3. The outer labels stay at 1 and 3.</text>
<g data-arrangement="0" data-slopes="1,1.5,2,2.5,3" data-origin="63" data-center="620" data-scale="29">
<rect x="35" y="202" width="550" height="484" rx="14" fill="#141829" stroke="#383b50"/>
<text x="57" y="242" font-size="28" fill="#f4f1e8" >Equal slope gaps.</text>
<text x="57" y="277" font-size="21" fill="#9fc7eb" >1, 1.5, 2, 2.5, 3</text>
<defs><clipPath id="arrangement-0-clip"><rect x="53" y="298" width="514" height="290"/></clipPath></defs>
