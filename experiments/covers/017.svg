<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
<title id="title">One ellipse. Many folds.</title>
<desc id="description">A fourteenfold orbital drawing at ninety degrees. One repeat is gold. Beside it, the ellipse seen from the first arm shows the same point. The views have different fixed scales.</desc>
