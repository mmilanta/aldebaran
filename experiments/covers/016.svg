<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
<title id="title">All the pockets, one band</title>
<desc id="description">Five limit parabolas enclose six pockets, gathered into the band between the nearer outer curve in gold and the nearest of all five in blue. A white horizontal slice marks its width. The axes have equal scales.</desc>
<rect width="640" height="400" fill="#0b0e1a"/>
