<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
<title id="title">One cubic, two area laws</title>
<desc id="description">Three graphs of the cubic separation against height: a cubic contact at opening zero and tilt zero; two equal pockets at opening one and tilt zero; and one surviving pocket at a quadratic touch at opening one and tilt one. The lower parameter map has a cusp separating one crossing from three. This is the leading model of two orbital branches, with independent normalized axis scales.</desc>
<rect width="1200" height="760" fill="#101323"/>
<g font-family="ui-sans-serif, system-ui, sans-serif">
<text x="50" y="55" fill="#f4f1e8" font-size="32" text-anchor="start">One cubic, two area laws</text>
<text x="50" y="90" fill="#c7c7d4" font-size="17" text-anchor="start">A leading model: q(v) = v³ − μv + 2τ/(3√3). Shading measures area between the graph and zero.</text>
<text x="220" y="127" fill="#e8b66e" font-size="21" text-anchor="middle">A cubic contact</text>
<text x="220" y="151" fill="#c7c7d4" font-size="16" text-anchor="middle">Opening 0 · tilt 0</text>
<rect x="65" y="170" width="310" height="265" rx="10" fill="#0b0e1a"/>
<clipPath id="clip-0"><rect x="70" y="175" width="300" height="255"/></clipPath>
<path d="M70 300H370 M220 175V430" stroke="#74788e" fill="none" stroke-width="1" />
