<text x="980" y="453" fill="#c7c7d4" font-size="14" text-anchor="middle">0</text>
<text x="1075" y="453" fill="#c7c7d4" font-size="14" text-anchor="middle">1</text>
<text x="980" y="480" fill="#c7c7d4" font-size="16" text-anchor="middle">Separation q →</text>
<text x="835" y="194" fill="#c7c7d4" font-size="14" text-anchor="start">Height v ↑</text>
<text x="980" y="512" fill="#f4f1e8" font-size="17" text-anchor="middle">Lower 0.75 · upper 0.00</text>
<text x="50" y="563" fill="#f4f1e8" font-size="22" text-anchor="start">Two routes through a parameter map</text>
<text x="50" y="602" fill="#9fc7eb" font-size="18" text-anchor="start">Mirror: tilt zero, opening μ &gt; 0.</text>
<text x="50" y="629" fill="#c7c7d4" font-size="18" text-anchor="start">Each pocket has area μ²/4.</text>
<text x="50" y="672" fill="#e8b66e" font-size="18" text-anchor="start">Tilt +1: increase opening from 1 to 1 + ε.</text>
<text x="50" y="699" fill="#c7c7d4" font-size="18" text-anchor="start">The new upper pocket has area ∼ (4/9) ε³⁄².</text>
