<circle cx="220.00000" cy="300.00000" r="6" fill="#0b0e1a" stroke="#f4f1e8" stroke-width="1.5"/>
</g>
<text x="59" y="399" fill="#c7c7d4" font-size="14" text-anchor="end">−1</text>
<text x="59" y="305" fill="#c7c7d4" font-size="14" text-anchor="end">0</text>
<text x="59" y="211" fill="#c7c7d4" font-size="14" text-anchor="end">1</text>
<text x="125" y="453" fill="#c7c7d4" font-size="14" text-anchor="middle">−1</text>
