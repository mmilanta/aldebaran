<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1590" viewBox="0 0 1200 1590" role="img" aria-labelledby="title description">
<title id="title">All the pockets, one band</title><desc id="description">Five limit parabolas with slopes between minus two and plus two. The gold edge is the nearer of the two extreme parabolas; the blue edge is the nearest of all five. Every bounded pocket, and no unbounded face, lies in the shaded band between them. In each row, subtracting Y squared over two straightens the complete arrangement without changing horizontal widths. Both arrangements have six bounded pockets. Equal gaps give total area five halves; gaps one, three halves, five quarters, and one quarter instead give 615 over 256. All four panels use equal and identical unit scales. White horizontal slices at Y=0 have unchanged widths. This is an exact arrangement of limiting parabolas, with no finite-offset or full-orbital-drawing claim.</desc>
<rect width="1200" height="1590" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="65" font-size="48" fill="#f4f1e8" >All the pockets, one band.</text>
<text x="35" y="110" font-size="23" fill="#c7c7d4" >Follow two envelopes. The shaded space gathers every bounded pocket.</text>
