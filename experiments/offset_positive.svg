<text x="42" y="651" font-size="27" fill="#f4f1e8" >What the selected local certificates force</text>
<text x="42" y="684" font-size="19" fill="#c7c7d4" >Eight fourfolds and five reflected ordinary pairs supply these positive passages.</text>
<text x="42" y="742" font-size="28" fill="#f4f1e8" >11 / 6</text>
<text x="174" y="742" font-size="25" fill="#e8b66e" >≥ 18 positive</text>
<text x="425" y="742" font-size="25" fill="#9fc7eb" >≥ 120 negative</text>
<text x="717" y="742" font-size="25" fill="#f4f1e8" >net −102</text>
<text x="963" y="742" font-size="25" fill="#f4f1e8" >≥ 138 triples</text>
<text x="174" y="774" font-size="18" fill="#c7c7d4" >4 mixed fourfolds × 2 + one fourfold × 4 + 3 reflected pairs × 2</text>
<text x="42" y="843" font-size="28" fill="#f4f1e8" >11 / 8</text>
<text x="174" y="843" font-size="25" fill="#e8b66e" >≥ 10 positive</text>
<text x="425" y="843" font-size="25" fill="#9fc7eb" >≥ 122 negative</text>
<text x="717" y="843" font-size="25" fill="#f4f1e8" >net −112</text>
<text x="963" y="843" font-size="25" fill="#f4f1e8" >≥ 132 triples</text>
<text x="174" y="875" font-size="18" fill="#c7c7d4" >3 mixed fourfolds × 2 + 2 reflected pairs × 2</text>
<rect x="20" y="920" width="1160" height="245" rx="14" fill="#0b0e1a" stroke="#383b50"/>
<text x="42" y="962" font-size="27" fill="#f4f1e8" >Outward, across the middle, then home</text>
<text x="42" y="996" font-size="19" fill="#c7c7d4" >The second outward leg is reversed on the way home: its passage signs reverse too.</text>
<text x="42" y="1040" font-size="16" fill="#c7c7d4" >OUTWARD 11 / 6</text>
<text x="42" y="1080" font-size="25" fill="#e8b66e" >≥ 18 positive</text>
<text x="42" y="1120" font-size="25" fill="#9fc7eb" >≥ 120 negative</text>
<text x="356" y="1040" font-size="16" fill="#c7c7d4" >DISTANT MIDDLE</text>
<text x="356" y="1080" font-size="25" fill="#e8b66e" >354 positive</text>
<text x="356" y="1120" font-size="25" fill="#9fc7eb" >368 negative</text>
<text x="666" y="1040" font-size="16" fill="#c7c7d4" >HOME TO 11 / 8</text>
<text x="666" y="1080" font-size="25" fill="#e8b66e" >≥ 122 positive</text>
<text x="666" y="1120" font-size="25" fill="#9fc7eb" >≥ 10 negative</text>
<text x="985" y="1039" font-size="16" fill="#c7c7d4" >TOTAL</text>
<text x="985" y="1085" font-size="43" fill="#f4f1e8" font-weight="650">≥ 992</text>
<text x="985" y="1120" font-size="18" fill="#c7c7d4" >≥494+ / ≥498−</text>
<text x="30" y="1210" font-size="21" fill="#f4f1e8" >A lower bound for the sufficiently distant constructed route. The net signed change remains −4.</text>
<text x="30" y="1246" font-size="18" fill="#c7c7d4" >Exact outward-leg counts remain open. No numerical threshold for middle-event stability is supplied.</text>
