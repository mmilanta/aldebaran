<text x="35" y="761" font-size="28" fill="#f4f1e8" >Smallest area: +29.39%. Total area: −5.77%.</text>
<text x="35" y="802" font-size="21" fill="#c7c7d4" >Each change uses its own area at the largest-total placement as its baseline.</text>
<text x="35" y="841" font-size="21" fill="#c7c7d4" >Both drawings share coordinates and unit scale. All three complete pockets are shaded.</text>
