<text x="647" y="804" font-size="27" fill="#f4f1e8" >Total area = 9/4</text>
<text x="647" y="849" font-size="27" fill="#e8b66e" >Smallest pocket = 3/4</text>
<text x="647" y="894" font-size="22" fill="#aaaabd" >Gaps: 1, 2, 1</text>
<text x="35" y="963" font-size="25" fill="#f4f1e8" >With span L and four slopes: no smallest pocket can exceed 3L³/256.</text>
<text x="35" y="1004" font-size="22" fill="#c7c7d4" >Odd slope counts favor equal gaps. Larger even counts favor alternating gaps.</text>
