<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title description">
<title id="title">Make the smallest pocket larger</title><desc id="description">Two four-parabola arrangements with fixed outer slopes minus two and plus two. Equal gaps maximize total area, 64 over 27, with individual pocket areas 16 over 27, 32 over 27, and 16 over 27. Gaps one, two, one instead make all three pocket areas exactly three quarters, with total nine quarters. This second arrangement uniquely maximizes the smallest pocket at this span, despite its smaller total. Gold marks the smallest pockets; blue marks a larger pocket. Exact areas are written inside the pockets. Both panels use identical unit scales. This is a complete limit-parabola arrangement, not a finite orbital drawing. The accompanying proof also gives the optimum for every larger slope count.</desc>
<rect width="1200" height="1130" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="65" font-size="46" fill="#f4f1e8" >Make the smallest pocket larger.</text>
<text x="35" y="110" font-size="23" fill="#c7c7d4" >The most total area and the largest smallest pocket can need different spacing.</text>
<rect x="35" y="143" width="25" height="18" fill="#e8b66e" fill-opacity=".7"/>
<text x="72" y="160" font-size="21" fill="#c7c7d4" >Smallest pockets</text>
<rect x="410" y="143" width="25" height="18" fill="#9fc7eb" fill-opacity=".7"/>
<text x="447" y="160" font-size="21" fill="#c7c7d4" >A larger pocket</text>
<text x="35" y="210" font-size="28" fill="#f4f1e8" >Largest total</text>
<g data-chart="balance-0" data-scale="86" data-origin="172.7" data-center="505" data-straight="false" data-slopes="-2,-2/3,2/3,2">
<rect x="35" y="230" width="540" height="520" rx="14" fill="#141829" stroke="#383b50"/>
<text x="57" y="266" font-size="27" fill="#f4f1e8" >Equal gaps</text>
<text x="57" y="294" font-size="18" fill="#c7c7d4" >p = (-2, -2/3, 2/3, 2)</text>
<defs><clipPath id="balance-0-clip"><rect x="59" y="308" width="492" height="394"/></clipPath></defs>
