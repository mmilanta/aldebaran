<text x="35" y="963" font-size="25" fill="#f4f1e8" >With span L and four slopes: no smallest pocket can exceed 3L³/256.</text>
<text x="35" y="1038" font-size="29" fill="#f4f1e8" >Between them, a smooth compromise.</text>
<text x="35" y="1079" font-size="22" fill="#c7c7d4" >Along this curve, more total area always costs some of the smallest pocket.</text>
