</g>
<text x="57" y="804" font-size="27" fill="#f4f1e8" >Total area = 64/27</text>
<text x="57" y="849" font-size="27" fill="#e8b66e" >Smallest pocket = 16/27</text>
<text x="57" y="894" font-size="22" fill="#aaaabd" >Gaps: 4/3, 4/3, 4/3</text>
<text x="625" y="210" font-size="28" fill="#f4f1e8" >Largest smallest pocket</text>
<g data-chart="balance-1" data-scale="86" data-origin="762.7" data-center="505" data-straight="false" data-slopes="-2,-1,1,2">
<rect x="625" y="230" width="540" height="520" rx="14" fill="#141829" stroke="#383b50"/>
<text x="647" y="266" font-size="27" fill="#f4f1e8" >Gaps in the ratio 1 : 2 : 1</text>
<text x="647" y="294" font-size="18" fill="#c7c7d4" >p = (-2, -1, 1, 2)</text>
