<text x="863.033333" y="510.5" font-size="16" fill="#f4f1e8" text-anchor="middle" data-role="face-label">3/4</text>
<text x="798.533333" y="453.166667" font-size="16" fill="#f4f1e8" text-anchor="middle" data-role="face-label">3/4</text>
</g>
<text x="1135" y="732" font-size="17" fill="#aaaabd" text-anchor="end">X →</text>
<text x="1135" y="294" font-size="17" fill="#aaaabd" text-anchor="end">Y ↑</text>
</g>
<text x="647" y="804" font-size="27" fill="#f4f1e8" >Total area = 9/4</text>
