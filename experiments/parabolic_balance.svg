<text x="625" y="210" font-size="28" fill="#f4f1e8" >Largest smallest pocket</text>
<g data-chart="balance-1" data-scale="86" data-origin="762.7" data-center="505" data-straight="false" data-slopes="-2,-1,1,2">
<rect x="625" y="230" width="540" height="520" rx="14" fill="#141829" stroke="#383b50"/>
