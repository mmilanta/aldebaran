<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-labelledby="title description">
<title id="title">A curved triangle, read with a straight ruler</title><desc id="description">Three rows compare a pocket bounded by parabolas with the straight triangle obtained by U=X minus Y squared over two. This horizontal shear preserves every horizontal width and therefore area. All plots have the same scale on both axes. The outer slopes stay at minus two and plus two. The middle slopes are zero, one, and seven quarters; the exact areas in each pair are two, three halves, and fifteen thirty-seconds. Bringing two slopes close shrinks the area. These are limiting curves of three selected arcs, not finite-distance enclosures or a face census for a whole drawing.</desc>
<rect width="1200" height="1640" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="60" font-size="45" fill="#f4f1e8" >A curved triangle,</text>
<text x="35" y="120" font-size="45" fill="#f4f1e8" >read with a straight ruler.</text>
<text x="35" y="164" font-size="23" fill="#c7c7d4" >Subtract the same parabola from every branch. The area stays the same.</text>
<text x="35" y="198" font-size="19" fill="#9999ae" >Gold: first slope · blue: middle · lilac: last. Equal unit scales throughout.</text>
<rect x="35" y="215" width="540" height="400" rx="14" fill="#141829" stroke="#383b50"/>
<text x="60" y="251" font-size="27" fill="#f4f1e8" >Equal gaps · 2 and 2</text>
<text x="60" y="279" font-size="18" fill="#c7c7d4" >Xᵢ = (Y − pᵢ)²/2 · p = (-2, 0, 2)</text>
