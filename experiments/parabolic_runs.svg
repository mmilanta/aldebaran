<text x="35" y="1165" font-size="27" fill="#f4f1e8" >Total = 3 × 1/4 + 2 × 1/2 + 1 × 3/4 = 5/2.</text>
<text x="35" y="1210" font-size="23" fill="#c7c7d4" >n distinct slopes give (n − 1)(n − 2)/2 bounded pockets, even when gaps differ.</text>
<text x="35" y="1250" font-size="18" fill="#aaaabd" >Equal unit scales in both panels. This classifies exact limit parabolas, with no finite-orbital face claim.</text>
