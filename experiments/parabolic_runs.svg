<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="title description">
<title id="title">A pocket chooses a run</title><desc id="description">Six bounded pockets of the five parabolas with slopes minus two, minus one, zero, one, two. Each pocket is identified by the slopes of the curves lying to its left: a nonempty consecutive run of the three interior slopes. The same letters A through F mark the curved pockets and their straightened images. One-slope runs A, D, F are gold and have area one quarter each; two-slope runs B, E are blue and have area one half each; the three-slope run C is lilac and has area three quarters. The cards list every run and repeat these areas. Both panels use identical unit scales. In a straightened arrangement every one-slope face is a triangle and every longer-run face is a quadrilateral. The classification applies to distinct slopes, including unequal gaps; only these simple area multiples need equal spacing. These are complete exact limit arrangements, not a finite orbital drawing.</desc>
<rect width="1200" height="1290" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="65" font-size="48" fill="#f4f1e8" >A pocket chooses a run.</text>
<text x="35" y="110" font-size="23" fill="#c7c7d4" >Look left from inside a pocket. Those curves always have consecutive slopes.</text>
<rect x="35" y="143" width="25" height="18" fill="#e8b66e" fill-opacity=".7"/>
<text x="72" y="160" font-size="20" fill="#c7c7d4" >One slope · area 1/4</text>
<rect x="410" y="143" width="25" height="18" fill="#9fc7eb" fill-opacity=".7"/>
<text x="447" y="160" font-size="20" fill="#c7c7d4" >Two slopes · area 1/2</text>
<rect x="785" y="143" width="25" height="18" fill="#d1b6ea" fill-opacity=".7"/>
<text x="822" y="160" font-size="20" fill="#c7c7d4" >Three slopes · area 3/4</text>
<g data-chart="runs-curved" data-scale="86" data-origin="172.7" data-center="480" data-straight="false" data-slopes="-2,-1,0,1,2">
<rect x="35" y="205" width="540" height="520" rx="14" fill="#141829" stroke="#383b50"/>
<text x="57" y="241" font-size="27" fill="#f4f1e8" >Curved pockets</text>
<text x="57" y="269" font-size="18" fill="#c7c7d4" >Xᵢ = (Y − pᵢ)²/2</text>
