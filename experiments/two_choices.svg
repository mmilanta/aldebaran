<text x="823" y="634" font-size="25" fill="#f4f1e8" >Area = 27/256</text>
<text x="823" y="668" font-size="20" fill="#c7c7d4" >A global maximum.</text>
</g>
<text x="35" y="735" font-size="22" fill="#c7c7d4" >Either best choice gains exactly 8% over the midpoint. Every panel uses the same unit scale.</text>
<text x="35" y="777" font-size="24" fill="#f4f1e8" >The intercept is strictly convex throughout: h″(p) = 3p² + 1/8 &gt; 0.</text>
<text x="35" y="819" font-size="22" fill="#c7c7d4" >Convexity proves the pocket formula. The shape of h decides where its maxima lie.</text>
<text x="35" y="881" font-size="31" fill="#f4f1e8" >The best placement need not be unique.</text>
