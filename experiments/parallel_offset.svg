<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
<title id="title">The way out, and the way home</title>
<desc id="description">Two step graphs count transverse crossing pairs along outward parallel offsets of the 11 / 6 and 11 / 8 curves. Each goes from forty to 106 by thirty-three inverse contact pairs at eighteen offset weights, including mirror partners at the same weight. Reversing the second leg gives thirty-three deaths. The middle of the positive-front construction avoids both types of touch, giving a generic route with sixty-six inverse touches and no direct ones. Values at contact weights are omitted. Horizontal positions are rounded from rational certificates.</desc>
<rect width="1200" height="750" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="61" font-size="43" fill="#f4f1e8" font-weight="650" letter-spacing="-1.5">The way out, and the way home.</text>
<text x="35" y="103" font-size="21" fill="#c7c7d4" >Every outward inverse touch creates two crossings. None of them takes a pair away.</text>
<rect x="30" y="140" width="550" height="515" rx="14" fill="#0b0e1a" stroke="#383b50"/>
<text x="305" y="182" font-size="26" fill="#f4f1e8" text-anchor="middle">Rhythms 11 / 6</text>
<text x="95" y="222" font-size="17" fill="#c7c7d4" >Crossing pairs</text>
<path d="M95,570H550" stroke="#383b50" fill="none" stroke-dasharray="3 5"/>
<text x="83" y="575" font-size="16" fill="#c7c7d4" text-anchor="end">40</text>
<path d="M95,480H550" stroke="#383b50" fill="none" stroke-dasharray="3 5"/>
<text x="83" y="485" font-size="16" fill="#c7c7d4" text-anchor="end">60</text>
<path d="M95,390H550" stroke="#383b50" fill="none" stroke-dasharray="3 5"/>
<text x="83" y="395" font-size="16" fill="#c7c7d4" text-anchor="end">80</text>
