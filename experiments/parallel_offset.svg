<path d="M685,570H687V561H706.75V543H764.94V525H766.25V507H805.27V489H816.38V471H825.44V453H872.1V435H888.34V417H944.58V408H952.64V390H958.72V372H964.2V354H965.04V336H1014.54V318H1021.65V300H1033.77V291H1050.82V273H1140" fill="none" stroke="#9fc7eb" stroke-width="2.6" stroke-linejoin="round"/>
<text x="895" y="630" font-size="18" fill="#c7c7d4" text-anchor="middle">Outward distance offset M →</text>
<text x="35" y="700" font-size="23" fill="#f4f1e8" >33 births on the way out · 33 deaths on the way home · no touches in the middle</text>
<text x="35" y="735" font-size="18" fill="#c7c7d4" >Away from contact weights. Mirror partners can occur together; each contact pair contributes its own jump.</text>
</g></svg>
