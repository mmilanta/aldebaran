<text x="83" y="305" font-size="16" fill="#c7c7d4" text-anchor="end">100</text>
<path d="M95,273H550" stroke="#383b50" fill="none" stroke-dasharray="3 5"/>
<text x="83" y="278" font-size="16" fill="#c7c7d4" text-anchor="end">106</text>
