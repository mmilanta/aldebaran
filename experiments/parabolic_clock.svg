<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
<title id="title">One clock, through a curved ruler</title><desc id="description">Before, at, and after the limiting plane triple for slopes minus two, one, and two and route rates zero, one, and zero. The scaled route parameters are zero, three halves, and three. Above, the straightened triangles shrink to a point and grow on the other side by a homothety centered at U=2,Y=0. Below, restoring Y squared over two bends their edges back into parabolas. Before and after both have exact area three halves, although the curved shapes look different. Every panel has equal unit scales, and the same scale is used in all six panels. The plane triple clock is a local limiting statement; these panels do not give a finite-offset threshold or a full-drawing face census.</desc>
<rect width="1200" height="1040" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="61" font-size="44" fill="#f4f1e8" >One clock, through a curved ruler.</text>
<text x="35" y="105" font-size="22" fill="#c7c7d4" >Lift only the middle branch: X₁ = (Y − 1)²/2 + μ. Slopes stay at −2, 1, 2.</text>
<text x="35" y="143" font-size="22" fill="#c7c7d4" >The limiting meeting is at μ = 3/2. Both sides have area (3/2)(1 − 2μ/3)².</text>
<text x="42" y="194" font-size="25" fill="#f4f1e8" >Before · μ = 0</text>
<rect x="25" y="213" width="360" height="698" rx="14" fill="#141829" stroke="#383b50"/>
<text x="45" y="248" font-size="23" fill="#f4f1e8" >Straight ruler</text>
