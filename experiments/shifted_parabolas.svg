</g>
<text x="637" y="628" font-size="25" fill="#f4f1e8" >Area = (66√11 − 71)/36</text>
<text x="637" y="664" font-size="21" fill="#c7c7d4" >About 4.108257 · a gain of 2.7064%.</text>
</g>
<text x="35" y="735" font-size="22" fill="#c7c7d4" >Same coordinates, same unit scale in both panels. Gold: the fixed outer curves.</text>
<text x="35" y="772" font-size="22" fill="#c7c7d4" >The dashed blue curve keeps the old midpoint visible in the right panel.</text>
<text x="35" y="822" font-size="22" fill="#c7c7d4" >Each curve slides by p³/3 − p²/2 from the earlier quadratic-intercept family.</text>
<text x="35" y="879" font-size="30" fill="#f4f1e8" >Which inserted slope leaves the most room?</text>
