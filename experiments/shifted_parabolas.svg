<rect x="615" y="202" width="550" height="484" rx="14" fill="#141829" stroke="#383b50"/>
<text x="637" y="242" font-size="27" fill="#f4f1e8" >Choose the largest pocket.</text>
<text x="637" y="277" font-size="22" fill="#a7d9bb" >r* = (1 + √11)/2 ≈ 2.158312</text>
