<text x="1145" y="269" font-size="17" fill="#aaaabd" text-anchor="end">Y ↑</text>
</g>
<text x="835" y="660" font-size="25" fill="#f4f1e8" >Total area = 64/27</text>
<text x="835" y="698" font-size="19" fill="#c7c7d4" >Three pockets · largest total</text>
<text x="835" y="741" font-size="20" fill="#aaaabd" >Gaps: 4/3, 4/3, 4/3</text>
<rect x="35" y="797" width="1130" height="156" rx="12" fill="#141829" stroke="#383b50"/>
<text x="58" y="837" font-size="23" fill="#f4f1e8" >In a fixed gap of length g, insertion splits it into a + b = g.</text>
<text x="58" y="879" font-size="27" fill="#a7d9bb" >Added area = abg/8 = g³/32 − (g/8)(a − g/2)².</text>
<text x="58" y="924" font-size="21" fill="#c7c7d4" >The largest fixed-gap gain is at its midpoint; a larger gap gives a larger gain.</text>
<text x="35" y="1000" font-size="20" fill="#aaaabd" >A best single addition keeps the old slopes fixed. The best full arrangement can move them.</text>
</g></svg>
