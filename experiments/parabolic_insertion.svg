<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
<title id="title">Where should the next parabola go?</title><desc id="description">Three equal-scale panels show slopes minus two, zero, two; insertion of minus one; and redistribution to four equally spaced slopes minus two, minus two thirds, two thirds, two. Total areas are two, nine quarters, and 64 over 27. Splitting one existing gap at its midpoint adds the most area when the old slopes are held fixed: one quarter here. The green patch marks exactly the newly added area, inside the gold outer envelope. Moving all four slopes to equal spacing gives a larger global area. A best single insertion and a best complete arrangement solve different constrained problems. These are exact limiting parabolas at scaled route parameter zero.</desc>
<rect width="1200" height="1040" fill="#101323"/><g font-family="ui-sans-serif,system-ui,sans-serif">
<text x="35" y="65" font-size="45" fill="#f4f1e8" >Where should the next parabola go?</text>
<text x="35" y="110" font-size="23" fill="#c7c7d4" >Split a wide gap at its midpoint. Then compare with spacing every slope again.</text>
<g data-chart="insert-0" data-scale="56" data-origin="116.8" data-center="420" data-straight="false" data-slopes="-2,0,2">
<rect x="25" y="205" width="360" height="400" rx="14" fill="#141829" stroke="#383b50"/>
<text x="47" y="241" font-size="27" fill="#f4f1e8" >Keep three slopes</text>
<text x="47" y="269" font-size="18" fill="#c7c7d4" >p = (-2, 0, 2)</text>
<defs><clipPath id="insert-0-clip"><rect x="49" y="283" width="312" height="274"/></clipPath></defs>
<rect x="49" y="283" width="312" height="274" fill="#0b0e1a"/>
<path d="M49,532H361" stroke="#252b42"/>
<text x="55" y="527" font-size="14" fill="#aaaabd" >-2</text>
<path d="M49,476H361" stroke="#252b42"/>
<text x="55" y="471" font-size="14" fill="#aaaabd" >-1</text>
<path d="M49,420H361" stroke="#252b42"/>
<text x="55" y="415" font-size="14" fill="#aaaabd" >0</text>
<path d="M49,364H361" stroke="#252b42"/>
<text x="55" y="359" font-size="14" fill="#aaaabd" >1</text>
<path d="M49,308H361" stroke="#252b42"/>
<text x="55" y="303" font-size="14" fill="#aaaabd" >2</text>
<g clip-path="url(#insert-0-clip)">
<path d="M144.8,476Q116.8,448 116.8,420Q116.8,392 144.8,364L144.8,364Q172.8,392 228.8,420Q172.8,448 144.8,476Z" fill="#9fc7eb" fill-opacity=".25" data-role="band"/>
<path d="M117.92,543.2Q93.28,420 610.72,296.8" fill="none" stroke="#c7c7d4" stroke-opacity=".4" stroke-width="1.5" data-role="branch"/>
