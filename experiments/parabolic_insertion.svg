<text x="440" y="660" font-size="25" fill="#f4f1e8" >Total area = 9/4</text>
<text x="440" y="698" font-size="19" fill="#c7c7d4" >Three pockets · gain 1/4</text>
<text x="440" y="741" font-size="20" fill="#aaaabd" >Gaps: 1, 1, 2</text>
<g data-chart="insert-2" data-scale="56" data-origin="906.8" data-center="420" data-straight="false" data-slopes="-2,-2/3,2/3,2">
<rect x="815" y="205" width="360" height="400" rx="14" fill="#141829" stroke="#383b50"/>
<text x="837" y="241" font-size="27" fill="#f4f1e8" >Move all four</text>
<text x="837" y="269" font-size="18" fill="#c7c7d4" >p = (-2, -2/3, 2/3, 2)</text>
<defs><clipPath id="insert-2-clip"><rect x="839" y="283" width="312" height="274"/></clipPath></defs>
<rect x="839" y="283" width="312" height="274" fill="#0b0e1a"/>
