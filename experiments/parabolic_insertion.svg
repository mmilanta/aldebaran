<text x="845" y="303" font-size="14" fill="#aaaabd" >2</text>
<g clip-path="url(#insert-2-clip)">
<path d="M919.244444,494.666667Q894.355556,457.333333 919.244444,420Q894.355556,382.666667 919.244444,345.333333L919.244444,345.333333Q944.133333,382.666667 1018.8,420Q944.133333,457.333333 919.244444,494.666667Z" fill="#9fc7eb" fill-opacity=".25" data-role="band"/>
