<path d="M610.72,543.2Q93.28,420 117.92,296.8" fill="none" stroke="#c7c7d4" stroke-opacity=".4" stroke-width="1.5" data-role="branch"/>
<path d="M144.8,476Q172.8,448 228.8,420Q172.8,392 144.8,364" fill="none" stroke="#e8b66e" stroke-width="3.2" stroke-linejoin="round" data-role="outer"/>
<path d="M144.8,476Q116.8,448 116.8,420Q116.8,392 144.8,364" fill="none" stroke="#9fc7eb" stroke-width="3.2" stroke-linejoin="round" data-role="inner"/>
</g>
<text x="355" y="587" font-size="17" fill="#aaaabd" text-anchor="end">X →</text>
<text x="355" y="269" font-size="17" fill="#aaaabd" text-anchor="end">Y ↑</text>
</g>
<text x="45" y="660" font-size="25" fill="#f4f1e8" >Total area = 2</text>
<text x="45" y="698" font-size="19" fill="#c7c7d4" >One pocket</text>
<text x="45" y="741" font-size="20" fill="#aaaabd" >Gaps: 2, 2</text>
<g data-chart="insert-1" data-scale="56" data-origin="511.8" data-center="420" data-straight="false" data-slopes="-2,-1,0,2">
<rect x="420" y="205" width="360" height="400" rx="14" fill="#141829" stroke="#383b50"/>
<text x="442" y="241" font-size="27" fill="#f4f1e8" >Add one slope</text>
<text x="442" y="269" font-size="18" fill="#c7c7d4" >p = (-2, -1, 0, 2)</text>
<defs><clipPath id="insert-1-clip"><rect x="444" y="283" width="312" height="274"/></clipPath></defs>
<rect x="444" y="283" width="312" height="274" fill="#0b0e1a"/>
